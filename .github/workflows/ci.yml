name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:   # also runs the manual-only jobs (race, fuzz)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, go: '1.25' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  race:
    if: github.event_name == 'workflow_dispatch'   # manual only: run from the Actions tab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.0

  fuzz:
    if: github.event_name == 'workflow_dispatch'   # manual only: run from the Actions tab
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./text, name: FuzzParse }
          - { pkg: ./text, name: FuzzRoundTrip }
          - { pkg: ./json, name: FuzzParse }
          - { pkg: ./json, name: FuzzRoundTrip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test -run=^$ -fuzz=^${{ matrix.target.name }}$ -fuzztime=60s ${{ matrix.target.pkg }}
